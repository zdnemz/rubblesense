; RubbleSense - ESP32 radar life-sign SAR aid (research prototype)
;
;   pio run -e esp32dev          field build: I/Q front-end on UART2 (GPIO36 RX / GPIO14 TX)
;   pio run -e esp32dev_usb_iq   hardware-in-the-loop: I/Q frames arrive over the USB serial port
;   pio run -e wokwi             Wokwi simulator build (simulated radar, fast clock)
;
; NOTE: this file could not be built in the environment that produced the project (no access to
; the PlatformIO package registry). The firmware sources were compiled and run on a host with
; stub Arduino headers (see test/stubs and test/host); the first real build is yours to verify.

[platformio]
default_envs = esp32dev
src_dir = src
lib_dir = lib

[env]
platform = espressif32@^6.9.0
framework = arduino
board = esp32dev
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
board_build.filesystem = littlefs
lib_deps =
    adafruit/Adafruit GFX Library@^1.11.9
    adafruit/Adafruit ILI9341@^1.6.0
build_flags =
    -Wall
    -Wextra
    -Wdouble-promotion
    -DCORE_DEBUG_LEVEL=0

[env:esp32dev]
build_flags =
    ${env.build_flags}
    -DRS_WOKWI=0
    -DRS_IQ_ON_UART0=0

[env:esp32dev_usb_iq]
build_flags =
    ${env.build_flags}
    -DRS_WOKWI=0
    -DRS_IQ_ON_UART0=1

[env:wokwi]
build_flags =
    ${env.build_flags}
    -DRS_WOKWI=1
